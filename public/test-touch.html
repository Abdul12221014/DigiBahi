<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #canvas-container {
      width: 100%; height: 300px; overflow-y: auto;
      border: 2px solid #ccc;
    }
    canvas {
      width: 100%; height: 600px;
      touch-action: none;
    }
    #log {
      height: 200px; overflow-y: auto;
      border: 1px solid #333; background: #eee;
      padding: 10px; font-family: monospace;
    }
  </style>
</head>
<body>
  <h2>Touch Test</h2>
  <div id="canvas-container">
    <canvas id="myCanvas"></canvas>
  </div>
  <h3>Log:</h3>
  <div id="log"></div>
  <script>
    const canvas = document.getElementById('myCanvas');
    const logDiv = document.getElementById('log');
    let ctx = canvas.getContext('2d');
    
    // Set matching dimensions
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;

    function log(msg) {
      logDiv.innerHTML = msg + '<br>' + logDiv.innerHTML;
    }

    canvas.addEventListener('touchstart', (e) => log(`TOUCHSTART touches=${e.touches.length}`));
    canvas.addEventListener('mousedown', (e) => log(`MOUSEDOWN x=${e.clientX} y=${e.clientY}`));
    
    // Implementing our fix
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      log(`POINTERDOWN type=${e.pointerType} id=${e.pointerId}`);
    });
    
    canvas.addEventListener('pointermove', (e) => {
      e.preventDefault();
      log(`POINTERMOVE type=${e.pointerType} id=${e.pointerId} x=${e.clientX} y=${e.clientY}`);
    });

    canvas.addEventListener('pointerup', (e) => {
      log(`POINTERUP type=${e.pointerType} id=${e.pointerId}`);
    });

    canvas.addEventListener('pointercancel', (e) => {
      log(`POINTERCANCEL type=${e.pointerType} id=${e.pointerId}`);
    });
  </script>
</body>
</html>
